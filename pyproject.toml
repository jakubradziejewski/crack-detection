[project]
name = "crack-detection"
version = "0.1.0"
description = "Crack Detection in Images using Deep Learning"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "grad-cam>=1.5.5",
    "matplotlib>=3.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "kagglehub>=0.3.13",
    "scikit-learn>=1.7.2",
    "scikit-image>=0.25.2",
    "opencv-python>=4.8.0",
]

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu128" # Trying the newest CUDA index
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly" }
torchvision = { index = "pytorch-nightly" }
