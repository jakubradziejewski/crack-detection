[project]
name = "crack-detection"
version = "0.1.0"
description = "Crack Detection in Images using Deep Learning"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "grad-cam>=1.5.5",
    "matplotlib>=3.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "kagglehub>=0.3.13",
    "scikit-learn>=1.7.2",
    "scikit-image>=0.25.2",
    "opencv-python-headless>=4.10.0",
    "pydensecrf@git+https://github.com/lucasb-eyer/pydensecrf.git",
]

# Define the custom repository for CUDA 11.8
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

# Force torch to download ONLY from that custom repository
[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }