[project]
name = "crack-detection"
version = "0.1.0"
description = "Crack Detection in Images using Deep Learning"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "kagglehub>=0.3.13",
    "scikit-learn>=1.7.2",
    "scikit-image>=0.25.2",
    "opencv-python>=4.8.0",
]

# For older CUDA versions
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

# For newer CUDA versions
[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

# HERE CHOICE BETWEEN TORCH VERSION (choose which to comment/uncomment)
# Option 1: older CUDA 11.8 (default)
[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

# Option 2: newer CUDA 12.8 (uncomment to use)
# [tool.uv.sources]
# torch = { index = "pytorch-nightly" }
# torchvision = { index = "pytorch-nightly" }